<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Tool</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.454.0/font/lucide.css">
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; }
  input[type=range] { accent-color: #6d28d9; }
</style>
</head>
<body class="bg-[#fafafa] text-[#18181b] antialiased">
<div class="min-h-screen flex items-center justify-center p-4">

  <!-- REPLACE the inputs, the compute() function and the result layout with
       the real tool. Keep the structure: header / inputs / result / action. -->
  <div class="w-full max-w-lg bg-white rounded-2xl border border-[#e4e4e7] shadow-sm overflow-hidden">

    <!-- Header -->
    <div class="bg-[#6d28d9] px-6 py-5 text-white">
      <h1 class="text-lg font-semibold tracking-tight">Loan Repayment Calculator</h1>
      <p class="text-sm text-white/75 mt-0.5">Adjust the values to see your monthly payment</p>
    </div>

    <div class="p-6 space-y-5">

      <!-- Inputs -->
      <div>
        <label for="amount" class="flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-[#6b6b75] mb-2">
          <span>Loan amount</span>
          <span class="num text-[#18181b] normal-case tracking-normal text-sm font-semibold" id="amount-out">$25,000</span>
        </label>
        <input id="amount" type="range" min="1000" max="200000" step="1000" value="25000"
               class="w-full cursor-pointer">
      </div>

      <div>
        <label for="rate" class="flex items-center justify-between text-xs font-semibold uppercase tracking-wider text-[#6b6b75] mb-2">
          <span>Annual interest rate</span>
          <span class="num text-[#18181b] normal-case tracking-normal text-sm font-semibold" id="rate-out">5.5%</span>
        </label>
        <input id="rate" type="range" min="0.1" max="20" step="0.1" value="5.5"
               class="w-full cursor-pointer">
      </div>

      <div>
        <label for="years" class="block text-xs font-semibold uppercase tracking-wider text-[#6b6b75] mb-2">Term</label>
        <select id="years" class="w-full px-3 py-2.5 text-sm rounded-lg border border-[#e4e4e7] bg-white
                                   focus:outline-none focus-visible:ring-2 focus-visible:ring-[#6d28d9]">
          <option value="1">1 year</option>
          <option value="3">3 years</option>
          <option value="5" selected>5 years</option>
          <option value="10">10 years</option>
          <option value="15">15 years</option>
          <option value="30">30 years</option>
        </select>
      </div>

      <!-- Result -->
      <div class="rounded-xl border border-dashed border-[#e4e4e7] bg-[#fafafa] p-5">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold uppercase tracking-wider text-[#6b6b75]">Monthly payment</span>
          <i class="icon-info text-sm text-[#9ca3af]" aria-hidden="true" title="Principal + interest"></i>
        </div>
        <p class="text-[32px] font-bold num leading-none" id="monthly">$477.49</p>
        <dl class="mt-4 grid grid-cols-2 gap-3 text-xs">
          <div>
            <dt class="text-[#6b6b75]">Total interest</dt>
            <dd class="num font-semibold mt-0.5" id="interest">$3,649</dd>
          </div>
          <div>
            <dt class="text-[#6b6b75]">Total paid</dt>
            <dd class="num font-semibold mt-0.5" id="total">$28,649</dd>
          </div>
        </dl>
      </div>

      <!-- Action -->
      <button type="button" id="reset"
              class="w-full py-3 rounded-xl border border-[#e4e4e7] font-semibold text-sm
                     hover:bg-[#f4f4f5] transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-[#6d28d9]">
        Reset to defaults
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var money = new Intl.NumberFormat('en-US', {
    style: 'currency', currency: 'USD', maximumFractionDigits: 0
  });
  var moneyCents = new Intl.NumberFormat('en-US', {
    style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2
  });

  var DEFAULTS = { amount: 25000, rate: 5.5, years: 5 };

  // Standard amortisation formula: M = P·r / (1 − (1+r)^−n)
  function compute(principal, annualRatePct, years) {
    var n = Math.round(years * 12);
    if (n <= 0) return { monthly: 0, total: 0, interest: 0 };
    var r = annualRatePct / 100 / 12;
    var monthly = r === 0 ? principal / n : (principal * r) / (1 - Math.pow(1 + r, -n));
    var total = monthly * n;
    return { monthly: monthly, total: total, interest: total - principal };
  }

  var amount = $('amount'), rate = $('rate'), years = $('years');

  function render() {
    var p = parseFloat(amount.value);
    var r = parseFloat(rate.value);
    var y = parseFloat(years.value);

    $('amount-out').textContent = money.format(p);
    $('rate-out').textContent = r.toFixed(1) + '%';

    var res = compute(p, r, y);
    $('monthly').textContent = moneyCents.format(res.monthly);
    $('interest').textContent = money.format(res.interest);
    $('total').textContent = money.format(res.total);
  }

  // Debounce so dragging a slider stays smooth.
  var pending = null;
  function scheduleRender() {
    if (pending) return;
    pending = requestAnimationFrame(function () { pending = null; render(); });
  }

  [amount, rate].forEach(function (el) {
    el.addEventListener('input', scheduleRender);
  });
  years.addEventListener('change', render);

  $('reset').addEventListener('click', function () {
    amount.value = DEFAULTS.amount;
    rate.value = DEFAULTS.rate;
    years.value = DEFAULTS.years;
    render();
  });

  render();
})();
</script>
</body>
</html>
